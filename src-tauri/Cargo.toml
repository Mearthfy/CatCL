[package]
name = "catcl"
version = "0.1.0"
description = "CatCL Minecraft Java launcher"
edition = "2021"

[lib]
name = "catcl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "process", "time", "io-util", "sync", "macros", "rt-multi-thread", "net"] }
tokio-util = "0.7"
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
bincode = "1.3"
blake3 = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
